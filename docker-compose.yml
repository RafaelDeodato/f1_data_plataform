version: "3.9"

services:
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: f1_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: f1_data_app
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - .:/app
    command: sleep infinity

volumes:
  postgres_data:
    